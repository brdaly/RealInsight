name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Audit, lint, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@22.23.2
          cache: true
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # The application checks run first, and both audits last. Moving only the
      # full-tree audit to the end is not enough: an audit anywhere upstream of
      # these steps couples "a dependency has an advisory" to "we do not know
      # whether the code works", because a failing step aborts the job. That
      # coupling is what cost this repository every lint, typecheck, build and
      # test result on `main` from 2026-10-01, and it would have recurred on
      # the next production advisory with `audit:prod` still sitting first.
      # Ordering removes the coupling; the job still fails on a real finding,
      # it just reports the code's state too.
      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify deployment package
        run: pnpm verify:package

      - name: Test
        run: pnpm test:unit

      - name: Audit production dependencies
        run: pnpm run audit:prod

      - name: Audit dependencies (full tree)
        run: pnpm run audit
