name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@22.23.2
          cache: true
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify deployment package
        run: pnpm verify:package

      - name: Test
        run: pnpm test:unit

  # These jobs have no dependency on validate. A security finding must fail
  # its gate while still allowing application validation and the other audit
  # to report their own results.
  audit:
    name: Dependency audit (${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: full
            command: pnpm run audit
          - scope: production
            command: pnpm run audit:prod
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@22.23.2
          cache: true
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: ${{ matrix.command }}

  # Preserve the original required-check name while gating both independent
  # paths. Run even after a dependency fails, and reject skipped/cancelled jobs.
  validate:
    name: Audit, lint, build, and test
    if: always()
    needs: [application, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require application validation and both audits
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          test "$APPLICATION_RESULT" = success
          test "$AUDIT_RESULT" = success
